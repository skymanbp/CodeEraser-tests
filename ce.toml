# The suite's own gate (plan v2.18 step #12, user ruling 2026-08-28):
# this repository is mounted in CodeEraser as the `cli/tests` submodule,
# where it is a READER of the superproject's tree (its references and
# mentions count there) and never a measured part of it. What measures
# it is this file: the same six gates the superproject runs on itself
# (scan, dedup ratchet, check floor, deadcode, docdup, erase), rooted
# here — root resolution stops at a nested ce.toml, so `ce <cmd>
# cli/tests` judges this tree alone. Thresholds stay at the defaults.

[graph]
# This tree is a slice of the `cli` package: its three test binaries
# are cargo targets only in the superproject's cli/Cargo.toml, so the
# crate roots are declared here — each one mounts its `mod` children
# and anchors its `crate::` paths, and is a declared target for the
# entry role.
crate_roots = [
    "it/main.rs",
    "corelink_deadline.rs",
    "daemon_conn_deadline.rs",
]
# The four GUI gate scripts node runs by path from ci.yml, and the
# unit tree: every file under unit/ is a `#[cfg(test)] #[path] mod`
# of a superproject source file (plan v2.18 step #13) — mounted from
# outside, it has no root here to be reached from, so it is an entry.
entry_globs = ["gui/", "unit/"]

